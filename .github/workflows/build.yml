name: Build SmartStockAI APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -o SmartStockAI.zip -d unzipped_project

      - name: Fix 404 Model Name
        run: |
          FILE=$(find unzipped_project -name 'GeminiService.kt' | head -n 1)
          sed -i 's/gemini-2.5-flash/gemini-2.0-flash/g' "$FILE"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: |
          PROJECT_DIR=$(dirname "$(find unzipped_project -name 'settings.gradle.kts' | head -n 1)")
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartStockAI-Debug-APK
          path: "**/app-debug.apk"
